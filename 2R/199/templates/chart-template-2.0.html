<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G-Cubed Charts</title>
  <style>

{% raw %}
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,400;0,500;0,700;1,600&display=swap');

:root {
  --header-fade-in-time: 4.5s;
}


body,
html {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Poppins', arial, sans-serif;
  font-size: 16px;
  font-weight: 400;
  color: rgb(15, 76, 117);
}

.container {
  display: grid;
  grid-template-areas:
    "header header"
    "filter main-content"
    "footer footer";
  grid-template-rows: auto 1fr 1rem;
  grid-template-columns: 11rem 1fr;
  grid-column-gap: 0.5rem;
  height: 100vh;
  max-width: 85rem;
  margin: 0 auto;
  padding: 0px;
  box-sizing: border-box;
  overflow: hidden;

}

header {
  height: 84px;
  grid-area: header;
  overflow: hidden;
  display: flex;
  background-image: linear-gradient(
    to right,
    hsl(205, 44%, 40%),
    hsl(204, 57%, 30%)
  );
  align-items: center;
  justify-content: space-between;
  position: relative;
}

.logo-container {
  width: auto;
  height: 80%;
  display: flex;
  opacity: 0;
  margin-left: 1rem;
  margin-right: auto;
  animation: fadeIn var(--header-fade-in-time) forwards;
}

.logo-container svg {
  width: 100%;
  height: auto;
  aspect-ratio: auto 158.31 / 64;
}

.header-text {
  color: whitesmoke;
  font-size: 2rem;
  opacity: 0;
  text-align: center;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  animation: fadeIn var(--header-fade-in-time) forwards;
  line-height: 0.8;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

.filter {
  grid-area: filter;
  padding: 0;
  top: 0;
  overflow-y: auto;
  margin-left: 1rem;
}

.selection-div {
  margin-top: 1rem;
}

.selection-div-checkboxes {
  font-size: 0.7rem;
}

.selection-div-checkboxes label {
  display: block;
  overflow-wrap: anywhere;
}

.chart-column {
  grid-area: main-content;
  overflow: auto;
  width: 100%;
  font-size: 0.8rem;
}

.text-danger {
  max-height: 4rem;
  overflow-y: auto;
  font-size: 0.8rem;
  transition: background-color 0.3s ease-in-out;
  text-align: center;
  box-sizing: border-box;
}

.text-danger:not(:empty) {
  background-color: orange;
  color: black;
  border: 5px dashed red;
}

.btn-group {
  display: flex;
  justify-content: center;
  margin-bottom: 1rem;
  margin-top: 2rem;
}

.btn {
  background-color: #0069d9;
  background-image: linear-gradient(#316fe7, #1a5ee0);
  color: whitesmoke;
  padding: 0.5rem 1rem;
  border: none;
  cursor: pointer;
  border-radius: 0.25rem;
  font-size: 0.8rem;
  margin: 1rem;
}

.gCubedChartDiv {
  display: flex;
  flex-direction: column;
  max-width: 100%;
}

.gCubedChartPlotlyDiv {
  max-width: 100%;
  width: 100%;
}

.applicableSectors {
  font-size: 0.8rem;
}

.chartDataTable table {
  border-collapse: separate;
  border-spacing: 0.9rem 0.15rem;
  width: max-content;
}

.chartDataTable th {
  max-width: 8rem;
  overflow-wrap: normal;
  text-align: center;
  white-space: normal;
  width: 1%;
}

.chartDataTable th:first-child,
.chartDataTable td:first-child {
  text-align: left;
}

.chart-data-number-cell {
  text-align: right;
  white-space: nowrap;
}

.chart-data-number {
  display: inline-grid;
  grid-template-columns:
    calc(var(--decimal-left-chars) * 1ch)
    1ch
    calc(var(--decimal-right-chars) * 1ch);
  width: max-content;
  min-width: max-content;
  font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  white-space: nowrap;
}

.chart-data-number__integer {
  text-align: right;
}

.chart-data-number__point,
.chart-data-number__fraction {
  text-align: left;
}

footer {
  color: whitesmoke;
  grid-area: footer;
  background-image: linear-gradient(
    to right,
    hsl(205, 44%, 40%),
    hsl(204, 57%, 30%)
  );
  padding: 0;
  bottom: 0;
  text-align: center;
  font-size: 0.5rem;
  font-weight: 400;
  align-items: center;
  justify-content: center;
  display: flex;
}

@media print {
  body,
  html {
    height: auto;
    overflow: visible;
  }

  .container {
    height: auto;
    overflow: visible;
    display: block;
  }

  .logo-container {
    opacity: 1;
  }

  .filter,
  .main-content,
  footer {
    position: static;
    height: auto;
    overflow: visible;
  }

  .main-content {
    max-width: none;
  }

  header,
  footer {
    background-color: #0f4c75 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

{% endraw %}

  </style>
</head>
